; Merge into the official OptiScaler 0.9.4 INI. This is not a full replacement.
; Game: native XeSS Quality, FSR frame generation On, Reflex Off, native HDR On.
[FrameGen]
Enabled=true
FGInput=fsrfg
FGOutput=xefg
DisableUI=true
DisableHudless=true
DrawUIOverFG=false

[XeFG]
UIComposition=false
InterpolationCount=1

[Inputs]
EnableXeSSInputs=false
EnableFfxInputs=true
UseFfxInputs=true
EnableHotSwapping=false

[Spoofing]
Dxgi=false
StreamlineSpoofing=false
DxgiFactoryWrapping=false

[Menu]
OverlayMenu=true

[Plugins]
LoadReshade=false

[Log]
LogToFile=false
LogToConsole=false
LogLevel=3
