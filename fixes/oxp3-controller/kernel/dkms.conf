PACKAGE_NAME="hid-oxp-onex3"
PACKAGE_VERSION="0.1.4396c18"
BUILT_MODULE_NAME[0]="hid-oxp"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build W=1 modules"
AUTOINSTALL="yes"
# This bundle targets CachyOS kernels with matching installed headers.
BUILD_EXCLUSIVE_KERNEL=".*-cachyos.*"
