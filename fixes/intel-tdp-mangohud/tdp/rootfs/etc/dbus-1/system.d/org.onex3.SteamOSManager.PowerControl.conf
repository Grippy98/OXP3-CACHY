<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.onex3.SteamOSManager.PowerControl"/>
    <allow own="org.onex3.PowerControlActivator"/>
    <allow send_destination="org.onex3.SteamOSManager.PowerControl"/>
    <allow send_destination="org.onex3.PowerControlActivator"/>
  </policy>
  <policy user="ONEX3_SESSION_USER">
    <allow send_destination="org.onex3.SteamOSManager.PowerControl"/>
    <allow send_destination="org.onex3.PowerControlActivator"/>
  </policy>
</busconfig>
