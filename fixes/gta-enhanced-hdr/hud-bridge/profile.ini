; Merge these sections/keys into the existing working OptiScaler.ini.
; This is an overlay, not a complete replacement INI.
; Requires the exact paired OptiScaler/RenoDX builds and HDR runtime in README.md.
; Qualified only for the built-in 1920x1200 display with Reno GammaCorrection=1.
[Upscalers]
Dx12Upscaler=xess

[Plugins]
LoadReshade=true

[FrameGen]
Enabled=true
FGInput=fsrfg
FGOutput=xefg
DisableUI=true
DisableHudless=true
DrawUIOverFG=false
SkipResizeBuffers=true
ModifyBufferState=false
ModifySCIndex=false

[XeFG]
UIComposition=false
InterpolationCount=1

[Menu]
OverlayMenu=true

; Optional quiet settings for the next launch, with GTA fully closed.
; Successful diagnostics used file logging at level 1; these reduce logging only.
[Log]
LogToFile=false
LogToConsole=false
LogLevel=3
