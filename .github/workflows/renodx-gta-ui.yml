name: Experimental RenoDX GTA HUD build

on:
  push:
    branches: [experimental/gta-xefg-lifetime-20261105]
    paths:
      - .github/workflows/renodx-gta-ui.yml
      - experiments/renodx-gta-ui/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renodx-gta-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the source patch and build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Keep source line endings deterministic
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out exact RenoDX source and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: clshortfuse/renodx
          ref: bc0ead39917634e95c534f7e8cfb59ab82880747
          path: renodx-source
          submodules: recursive
          persist-credentials: false
      - name: Build GTA addon and regenerate its shaders
        shell: pwsh
        run: >-
          & ./experiments/renodx-gta-ui/build.ps1
          -SourceDir ./renodx-source
          -ArtifactDir ./renodx-artifact
      - name: Upload addon and source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renodx-bc0ead39-gta-ui
          path: renodx-artifact/
          if-no-files-found: error
          retention-days: 14
