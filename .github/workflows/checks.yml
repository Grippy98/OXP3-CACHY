name: Source and installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Source hygiene, syntax and documentation links
        run: python3 scripts/check_repo.py
      - name: Menu, dispatcher and HDMI audio transaction tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

# These checks do not install fixes, build a kernel/EFI image, or validate hardware.
